<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OMEGA Threat Intelligence Platform</title>
<style>
body{background:#0a0e17;color:#fff;font-family:monospace;padding:20px}
.topbar{display:flex;justify-content:space-between;background:#020617;padding:15px 25px;border-bottom:1px solid #1e293b;margin-bottom:20px}
.live-dot{width:10px;height:10px;background:#10b981;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0.3}}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
.card{background:#151c2c;border:1px solid #1e293b;border-radius:12px;padding:20px;text-align:center}
.value{font-size:2em;font-weight:bold;color:#3b82f6}
.label{color:#94a3b8;font-size:11px;margin-top:5px}
.chart-box{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.chart-card{background:#151c2c;border:1px solid #1e293b;border-radius:12px;padding:20px}
.chart-card h3{color:#3b82f6;margin-bottom:15px}
.chart-card{height:350px}
canvas{width:100%!important;height:100%!important}
.terminal{background:#020617;padding:15px;border-radius:8px;font-size:12px;height:200px;overflow-y:auto;margin-top:20px}
.log{color:#10b981;padding:3px 0}
.alert{color:#ef4444;padding:3px 0}
</style>
</head>
<body>
<div class="topbar">
<div><span class="live-dot"></span> <strong>OMEGA THREAT INTELLIGENCE</strong></div>
<div style="color:#94a3b8" id="clock"></div>
<div style="color:#10b981">● SYSTEM ONLINE</div>
</div>

<div class="stats-grid">
<div class="card"><div class="value">782K</div><div class="label">TOTAL IOC</div></div>
<div class="card"><div class="value">13</div><div class="label">APT GROUPS</div></div>
<div class="card"><div class="value">5</div><div class="label">ZERO-DAYS</div></div>
<div class="card"><div class="value">6</div><div class="label">BLOCKED IPs</div></div>
</div>

<div class="chart-box">
<div class="chart-card">
<h3>📊 THREAT OVERVIEW</h3>
<canvas id="chart1"></canvas>
</div>
<div class="chart-card">
<h3>🎯 C2 TRACKING</h3>
<canvas id="chart2"></canvas>
</div>
</div>

<div class="terminal" id="terminal">
<div class="log">$ OMEGA Platform ready</div>
</div>

<script src="chart.umd.js"></script>
<script>
// Clock
function updateClock() { document.getElementById('clock').textContent = new Date().toLocaleString('th-TH'); }
setInterval(updateClock, 1000); updateClock();

// Charts
document.addEventListener('DOMContentLoaded', function() {
    new Chart(document.getElementById('chart1'), {
        type: 'doughnut',
        data: {
            labels: ['IOC (782K)', 'APT (13)', 'Zero-Day (5)', 'Blocked (6)'],
            datasets: [{data: [782207, 13, 5, 6], backgroundColor: ['#3b82f6','#f59e0b','#ef4444','#10b981']}]
        },
        options: {responsive: true, maintainAspectRatio: false}
    });
    
    new Chart(document.getElementById('chart2'), {
        type: 'bar',
        data: {
            labels: ['Primary C2', 'Backup C2', 'Other'],
            datasets: [{data: [2, 1, 3], backgroundColor: ['#ef4444','#f59e0b','#3b82f6']}]
        },
        options: {responsive: true, maintainAspectRatio: false}
    });
});

// Terminal
const logs = [
    'ALERT: C2-PRIMARY blocked', 'INFO: 782K+ IOC loaded',
    'ALERT: APT36 detected', 'INFO: Threat intel updated'
];
let i = 0;
setInterval(() => {
    const t = document.getElementById('terminal');
    const d = document.createElement('div');
    d.className = logs[i].includes('ALERT') ? 'alert' : 'log';
    d.textContent = '$ ' + logs[i];
    t.appendChild(d); t.scrollTop = t.scrollHeight;
    i = (i+1) % logs.length;
    if (t.children.length > 10) t.removeChild(t.firstChild);
}, 3000);
</script>
</body>
</html>
