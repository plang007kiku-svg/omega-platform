<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OMEGA Threat Intelligence Platform</title>
<style>
body{background:#0a0e17;color:#fff;font-family:monospace;padding:20px}
.topbar{display:flex;justify-content:space-between;background:#020617;padding:15px 25px;border-bottom:1px solid #1e293b;margin-bottom:20px}
.live-dot{width:10px;height:10px;background:#10b981;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0.3}}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
.card{background:#151c2c;border:1px solid #1e293b;border-radius:12px;padding:20px;text-align:center}
.value{font-size:2em;font-weight:bold;color:#3b82f6}
.label{color:#94a3b8;font-size:11px;margin-top:5px}
.chart-box{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.chart-card{background:#151c2c;border:1px solid #1e293b;border-radius:12px;padding:20px;height:350px}
.chart-card h3{color:#3b82f6;margin-bottom:15px;font-size:14px}
canvas{width:100%!important;height:280px!important}
.terminal-box{background:#020617;border:1px solid #3b82f6;border-radius:12px;padding:15px;margin-top:20px;height:200px;overflow:hidden;position:relative}
.terminal-box h3{color:#3b82f6;font-size:14px;margin-bottom:10px}
.terminal-scroll{height:150px;overflow-y:auto;font-size:12px}
.log{color:#10b981;padding:3px 0;animation:slideUp 0.3s}
.alert{color:#ef4444;padding:3px 0;animation:slideUp 0.3s}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.blink-cursor{animation:blink 1s infinite;color:#3b82f6}
</style>
</head>
<body>
<div class="topbar">
<div><span class="live-dot"></span> <strong>OMEGA THREAT INTELLIGENCE</strong></div>
<div style="color:#94a3b8" id="clock"></div>
<div style="color:#10b981">● SYSTEM ONLINE</div>
</div>

<div class="stats-grid">
<div class="card"><div class="value">782K</div><div class="label">TOTAL IOC</div></div>
<div class="card"><div class="value">13</div><div class="label">APT GROUPS</div></div>
<div class="card"><div class="value">5</div><div class="label">ZERO-DAYS</div></div>
<div class="card"><div class="value">6</div><div class="label">BLOCKED IPs</div></div>
</div>

<div class="chart-box">
<div class="chart-card">
<h3>📊 IOC DISTRIBUTION</h3>
<canvas id="chart1"></canvas>
</div>
<div class="chart-card">
<h3>🎯 C2 TRACKING</h3>
<canvas id="chart2"></canvas>
</div>
</div>

<div class="terminal-box">
<h3>📡 REAL-TIME ENGINE LOG</h3>
<div class="terminal-scroll" id="terminal">
<div class="log">$ OMEGA Platform ready <span class="blink-cursor">█</span></div>
</div>
</div>

<script src="chart.umd.js"></script>
<script>
function updateClock() { document.getElementById('clock').textContent = new Date().toLocaleString('th-TH'); }
setInterval(updateClock, 1000); updateClock();

document.addEventListener('DOMContentLoaded', function() {
    // Chart 1: IOC Distribution (แก้จาก doughnut เป็น distribution ตาม category)
    new Chart(document.getElementById('chart1'), {
        type: 'doughnut',
        data: {
            labels: ['IP Addresses (45%)', 'File Hashes (25%)', 'Domains (20%)', 'URLs (10%)'],
            datasets: [{
                data: [45, 25, 20, 10],
                backgroundColor: ['#3b82f6', '#f59e0b', '#ef4444', '#10b981'],
                borderColor: '#0a0e17',
                borderWidth: 3
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: {
                        color: '#94a3b8',
                        font: {size: 11, family: 'monospace'},
                        padding: 10
                    }
                },
                title: {
                    display: true,
                    text: 'IOC Categories',
                    color: '#94a3b8',
                    font: {size: 12}
                }
            }
        }
    });

    // Chart 2: C2 Tracking (แก้ Legend + X-Axis font)
    new Chart(document.getElementById('chart2'), {
        type: 'bar',
        data: {
            labels: ['Primary C2', 'Backup C2', 'Active Beacon'],
            datasets: [{
                label: 'Blocked / Tracked',
                data: [2, 1, 3],
                backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6'],
                borderColor: '#0a0e17',
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'top',
                    labels: {
                        color: '#94a3b8',
                        font: {size: 12, family: 'monospace', weight: 'bold'},
                        boxWidth: 15,
                        boxHeight: 15
                    }
                }
            },
            scales: {
                x: {
                    ticks: {
                        color: '#e2e8f0',
                        font: {size: 12, family: 'monospace', weight: 'bold'}
                    },
                    grid: {color: '#1e293b'}
                },
                y: {
                    ticks: {
                        color: '#94a3b8',
                        font: {size: 11}
                    },
                    grid: {color: '#1e293b'},
                    beginAtZero: true
                }
            }
        }
    });
});

// Terminal Log (ใส่กรอบ + scrolling)
const logs = [
    'ALERT: C2-PRIMARY blocked at kernel level',
    'INFO: 782K+ IOC loaded to memory',
    'ALERT: APT36 C2 detected - auto-blocked',
    'INFO: Threat intel updated from MISP',
    'ALERT: Wizard Spider probe blocked',
    'INFO: Honeypot touched - evidence captured',
    'ALERT: DAIXIN Team C2 neutralized',
    'INFO: CSA playbook executed',
    'ALERT: Emotet IP blackholed',
    'INFO: Zero-day signature updated',
];
let logIndex = 0;
setInterval(() => {
    const terminal = document.getElementById('terminal');
    const d = document.createElement('div');
    d.className = logs[logIndex].includes('ALERT') ? 'alert' : 'log';
    d.textContent = '$ ' + logs[logIndex];
    terminal.appendChild(d);
    terminal.scrollTop = terminal.scrollHeight;
    logIndex = (logIndex + 1) % logs.length;
    if (terminal.children.length > 15) terminal.removeChild(terminal.firstChild);
}, 2500);
</script>
</body>
</html>
