<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OMEGA Threat Intelligence Platform</title>
<style>
body{background:#0a0e17;color:#fff;font-family:monospace;padding:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;background:#020617;padding:15px 25px;border-bottom:1px solid #1e293b;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.live-dot{width:10px;height:10px;background:#10b981;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0.3}}
.opsec-badge{background:#d4af37;color:#000;padding:4px 12px;border-radius:20px;font-weight:bold;font-size:11px}
.tlp-badge{background:#f39c12;color:#000;padding:4px 12px;border-radius:20px;font-weight:bold;font-size:11px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
.card{background:#151c2c;border:1px solid #1e293b;border-radius:12px;padding:20px;text-align:center}
.value{font-size:2em;font-weight:bold;color:#3b82f6}
.label{color:#94a3b8;font-size:11px;margin-top:5px}
.chart-box{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.chart-card{background:#151c2c;border:1px solid #1e293b;border-radius:12px;padding:20px;height:350px}
.chart-card h3{color:#3b82f6;margin-bottom:15px;font-size:14px}
canvas{width:100%!important;height:280px!important}
.terminal-box{background:#020617;border:1px solid #3b82f6;border-radius:12px;padding:15px;margin-top:20px}
.terminal-scroll{height:150px;overflow-y:auto;font-size:12px}
.log{color:#10b981;padding:3px 0}
.alert{color:#ef4444;padding:3px 0}
</style>
</head>
<body>
<div class="topbar">
<div><span class="live-dot"></span> <strong>OMEGA THREAT INTELLIGENCE</strong></div>
<div style="color:#94a3b8" id="clock"></div>
<div><span class="opsec-badge">OPSEC MODE</span> <span class="tlp-badge">TLP: AMBER</span></div>
<div style="color:#10b981">● SYSTEM ONLINE</div>
</div>

<div class="stats-grid">
<div class="card"><div class="value">782K+</div><div class="label">TOTAL IOC</div></div>
<div class="card"><div class="value">71</div><div class="label">APT GROUPS</div></div>
<div class="card"><div class="value">485</div><div class="label">THREAT RELATIONS</div></div>
<div class="card"><div class="value">6</div><div class="label">AUTO-BANS</div></div>
</div>

<div class="chart-box">
<div class="chart-card">
<h3>📊 IOC DISTRIBUTION</h3>
<canvas id="chart1"></canvas>
</div>
<div class="chart-card">
<h3>🎯 C2 TRACKING</h3>
<canvas id="chart2"></canvas>
</div>
</div>

<div class="terminal-box">
<h3>📡 REAL-TIME ENGINE LOG</h3>
<div class="terminal-scroll" id="terminal">
<div class="log">$ OMEGA Platform ready <span class="blink-cursor">█</span></div>
</div>
</div>

<script src="chart.umd.js"></script>
<script>
function updateClock() { document.getElementById('clock').textContent = new Date().toLocaleString('th-TH'); }
setInterval(updateClock, 1000); updateClock();

document.addEventListener('DOMContentLoaded', function() {
    new Chart(document.getElementById('chart1'), {
        type: 'doughnut',
        data: {
            labels: ['IP-HASH (45%)', 'SHA256-HASH (25%)', 'DOMAIN-HASH (20%)', 'URL-HASH (10%)'],
            datasets: [{ data: [45, 25, 20, 10], backgroundColor: ['#3b82f6', '#f59e0b', '#ef4444', '#10b981'], borderColor: '#0a0e17', borderWidth: 3 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } } }
    });

    new Chart(document.getElementById('chart2'), {
        type: 'bar',
        data: {
            labels: ['AS-QUADRA', 'AS-AMAZON', 'AS-VPS-ASIA', 'AS-EURO'],
            datasets: [{ label: 'C2 Nodes', data: [2, 1, 1, 2], backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6', '#10b981'] }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
});

const logs = [
    '[AUTOBAN_APPLIED] [C2-NODE-001]',
    '[MISP_SYNCED] [782K+ IOCs]',
    '[TAKEDOWN_NOTIFIED] [C2-NODE-002]',
    '[CSA_PLAYBOOK_EXECUTED]',
];
let logIndex = 0;
setInterval(() => {
    const terminal = document.getElementById('terminal');
    const d = document.createElement('div');
    d.className = logs[logIndex].includes('AUTOBAN') ? 'alert' : 'log';
    d.textContent = '$ ' + logs[logIndex];
    terminal.appendChild(d);
    terminal.scrollTop = terminal.scrollHeight;
    logIndex = (logIndex + 1) % logs.length;
    if (terminal.children.length > 15) terminal.removeChild(terminal.firstChild);
}, 2500);
</script>
</body>
</html>
